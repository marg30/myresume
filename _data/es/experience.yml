intro: "Mi experiencia combina desarrollo de software, inteligencia artificial, automatización de pruebas y optimización de procesos. He trabajado en equipos internacionales y multidisciplinarios, desarrollando soluciones técnicas y mejorando procesos en distintos entornos."

