    highlights:
      - "Desarrollé y mantuve pruebas automatizadas para aplicaciones .NET utilizando C#, Cucumber y Gherkin, implementando escenarios de desarrollo guiado por comportamiento (BDD)."
      - "Trabajé con NATS.NET para consumir mensajes de colas NATS, adquiriendo experiencia práctica en comunicación basada en mensajes y sistemas distribuidos orientados a eventos."
      - "Colaboré en flujos de trabajo de pruebas automatizadas y procesos de integración y entrega continuas (CI/CD) utilizando Azure Pipelines."
      - "Trabajé en un equipo internacional de desarrollo bajo metodologías ágiles, utilizando principalmente el alemán como idioma de trabajo."
    transferable: "Desarrollo con .NET, automatización de pruebas, BDD, sistemas distribuidos, colas de mensajes, CI/CD, depuración y metodologías ágiles."
